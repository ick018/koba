<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f2e9">
  <title>まちがいなく、ねらえ。 | 20秒ゲーム</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f2e9;
      --ink: #172a26;
      --muted: #64736a;
      --line: #d7d8c9;
      --green: #2f7459;
      --lime: #d8f36a;
      --coral: #e87258;
      --board: #e7e8d8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background-color: var(--paper);
      background-image: radial-gradient(#8d9b7a 0.65px, transparent 0.65px);
      background-size: 15px 15px;
      color: var(--ink);
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    }

    button { font: inherit; }

    .page {
      width: min(100% - 32px, 760px);
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .mark { display: flex; align-items: center; gap: 9px; }
    .mark-icon { width: 13px; height: 13px; background: var(--coral); border-radius: 50% 50% 50% 4px; transform: rotate(-45deg); }
    .edition { color: var(--muted); font-weight: 600; }

    main { padding-top: 34px; }

    .intro { margin-bottom: 24px; }
    .eyebrow { margin: 0 0 9px; color: var(--coral); font-size: 12px; font-weight: 800; letter-spacing: 0.12em; }
    h1 {
      margin: 0;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: clamp(29px, 7vw, 46px);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: 0;
    }
    .subtitle { margin: 9px 0 0; color: var(--muted); font-size: 14px; }

    .scorebar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      gap: 16px;
      margin-bottom: 12px;
    }
    .stat-label { display: block; margin-bottom: 3px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .stat-value { display: block; font-size: 25px; font-variant-numeric: tabular-nums; font-weight: 800; line-height: 1; }
    .stat:last-child { text-align: right; }
    .timer { display: flex; align-items: baseline; gap: 4px; color: var(--green); }
    .timer .stat-value { font-size: 32px; }
    .timer-unit { color: var(--muted); font-size: 12px; font-weight: 700; }

    .track { height: 5px; overflow: hidden; margin-bottom: 14px; background: var(--line); }
    .track-fill { width: 100%; height: 100%; background: var(--coral); transform-origin: left; transition: transform 0.12s linear; }

    .arena {
      position: relative;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: clamp(5px, 1.4vw, 10px);
      width: 100%;
      aspect-ratio: 1 / 0.72;
      padding: clamp(9px, 2vw, 16px);
      overflow: hidden;
      background: var(--board);
      border: 1px solid #d5d9c7;
      box-shadow: 0 5px 0 #dce0cf;
      touch-action: manipulation;
      user-select: none;
    }

    .cell {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      border: 1px solid #d7dcc8;
      background: #f1f1e7;
    }
    .cell::after {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #dfe2d4;
      content: "";
    }
    .cell.target { border-color: var(--green); background: var(--green); cursor: crosshair; }
    .cell.target::after {
      width: min(54%, 42px);
      height: auto;
      aspect-ratio: 1;
      border: 3px solid var(--lime);
      background: var(--coral);
      box-shadow: 0 0 0 5px rgb(216 243 106 / 18%);
      animation: pop 180ms ease-out both;
    }
    .cell.target:hover::after { transform: scale(1.12); }
    .cell:focus-visible { z-index: 1; outline: 3px solid var(--coral); outline-offset: -3px; }

    @keyframes pop { from { transform: scale(0.55); opacity: 0.5; } to { transform: scale(1); opacity: 1; } }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgb(23 42 38 / 72%);
      color: white;
      text-align: center;
    }
    .overlay[hidden] { display: none; }
    .overlay-content { max-width: 340px; }
    .overlay h2 { margin: 0 0 8px; font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; font-size: 26px; }
    .overlay p { margin: 0 0 19px; color: #e7ecdc; font-size: 13px; line-height: 1.7; }
    .start-button {
      min-height: 46px;
      padding: 0 23px;
      border: 0;
      background: var(--lime);
      color: var(--ink);
      font-weight: 800;
      cursor: pointer;
      transition: background 120ms ease, transform 120ms ease;
    }
    .start-button:hover { transform: translateY(-2px); background: #e5ff86; }
    .start-button:focus-visible { outline: 3px solid white; outline-offset: 3px; }

    .below {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-top: 15px;
      color: var(--muted);
      font-size: 12px;
    }
    .below strong { color: var(--ink); }

    footer { display: flex; justify-content: space-between; gap: 12px; margin-top: 34px; border-top: 1px solid var(--line); padding-top: 12px; color: var(--muted); font-size: 11px; }

    @media (max-width: 480px) {
      .page { width: min(100% - 22px, 760px); padding-top: 18px; }
      main { padding-top: 26px; }
      .arena { aspect-ratio: 1 / 0.86; }
      .below { font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="mark"><span class="mark-icon" aria-hidden="true"></span><span>FIELD NOTES / MINI GAME</span></div>
      <span class="edition">NO. 01</span>
    </header>

    <main>
      <section class="intro" aria-labelledby="title">
        <p class="eyebrow">20秒チャレンジ</p>
        <h1 id="title">まちがいなく、ねらえ。</h1>
        <p class="subtitle">動く的をタップ。集中力の勝負です。</p>
      </section>

      <section aria-label="ゲーム">
        <div class="scorebar" aria-live="polite">
          <div class="stat"><span class="stat-label">スコア</span><strong class="stat-value" id="score">00</strong></div>
          <div class="timer"><strong class="stat-value" id="time">20</strong><span class="timer-unit">秒</span></div>
          <div class="stat"><span class="stat-label">ベスト</span><strong class="stat-value" id="best">00</strong></div>
        </div>
        <div class="track" aria-hidden="true"><div class="track-fill" id="timebar"></div></div>
        <div class="arena" id="arena" role="group" aria-label="的をタップしてスコアを獲得するゲーム盤">
          <div class="overlay" id="overlay">
            <div class="overlay-content">
              <h2 id="overlay-title">準備はいい？</h2>
              <p id="overlay-copy">20秒で、いくつ捕まえられるかな。<br>的をタップしてスタート。</p>
              <button class="start-button" id="start" type="button">ゲームスタート</button>
            </div>
          </div>
        </div>
        <div class="below"><span>タップで +1</span><span>自己ベスト：<strong id="best-caption">00</strong></span></div>
      </section>
    </main>

    <footer><span>REFLEX / 20 SECONDS</span><span>FOCUS ON THE DOT</span></footer>
  </div>

  <script>
    const arena = document.querySelector("#arena");
    const overlay = document.querySelector("#overlay");
    const startButton = document.querySelector("#start");
    const scoreDisplay = document.querySelector("#score");
    const timeDisplay = document.querySelector("#time");
    const bestDisplay = document.querySelector("#best");
    const bestCaption = document.querySelector("#best-caption");
    const timebar = document.querySelector("#timebar");
    const overlayTitle = document.querySelector("#overlay-title");
    const overlayCopy = document.querySelector("#overlay-copy");
    const duration = 20;
    let score = 0;
    let best = Number(localStorage.getItem("target-game-best") || 0);
    let targetIndex = -1;
    let deadline = 0;
    let timerId = null;
    let playing = false;

    const cells = Array.from({ length: 25 }, (_, index) => {
      const cell = document.createElement("button");
      cell.className = "cell";
      cell.type = "button";
      cell.setAttribute("aria-label", `マス ${index + 1}`);
      cell.addEventListener("click", () => {
        if (!playing || index !== targetIndex) return;
        score += 1;
        scoreDisplay.textContent = String(score).padStart(2, "0");
        placeTarget();
      });
      arena.append(cell);
      return cell;
    });

    function showBest() {
      const formatted = String(best).padStart(2, "0");
      bestDisplay.textContent = formatted;
      bestCaption.textContent = formatted;
    }

    function placeTarget() {
      let nextIndex = Math.floor(Math.random() * cells.length);
      while (cells.length > 1 && nextIndex === targetIndex) {
        nextIndex = Math.floor(Math.random() * cells.length);
      }
      if (targetIndex >= 0) cells[targetIndex].classList.remove("target");
      targetIndex = nextIndex;
      cells[targetIndex].classList.add("target");
    }

    function finishGame() {
      playing = false;
      clearInterval(timerId);
      timerId = null;
      if (targetIndex >= 0) cells[targetIndex].classList.remove("target");
      targetIndex = -1;
      if (score > best) {
        best = score;
        localStorage.setItem("target-game-best", String(best));
        showBest();
      }
      overlayTitle.textContent = "おつかれさま！";
      overlayCopy.innerHTML = `スコアは <strong>${score}</strong> 点。もう一回いく？`;
      startButton.textContent = "もう一度プレイ";
      overlay.hidden = false;
    }

    function updateTimer() {
      const remaining = Math.max(0, deadline - Date.now());
      const seconds = Math.ceil(remaining / 1000);
      timeDisplay.textContent = String(seconds).padStart(2, "0");
      timebar.style.transform = `scaleX(${remaining / (duration * 1000)})`;
      if (remaining <= 0) finishGame();
    }

    function startGame() {
      score = 0;
      scoreDisplay.textContent = "00";
      timeDisplay.textContent = String(duration);
      timebar.style.transform = "scaleX(1)";
      overlay.hidden = true;
      playing = true;
      placeTarget();
      deadline = Date.now() + duration * 1000;
      timerId = setInterval(updateTimer, 80);
      updateTimer();
    }

    startButton.addEventListener("click", startGame);
    showBest();
  </script>
</body>
</html>
